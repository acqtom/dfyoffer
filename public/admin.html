<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff board · paidcoaching.com DFY</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=2">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=31">
</head>
<body>
  <header class="topbar">
    <img src="/logo.png" alt="Paidcoaching.com" class="topbar-logo">
    <div class="topbar-user">
      <button type="button" class="verify-btn" id="verify-btn" hidden>
        <span class="verify-dot" aria-hidden="true"></span>
        Verification needed
        <span class="verify-count" id="verify-count"></span>
      </button>
      <span class="staff-chip">Staff</span>
      <button class="btn btn-ghost" id="logout-btn">Log out</button>
    </div>
  </header>

  <main class="hub admin">
    <section class="hub-head">
      <div>
        <nav class="admin-tabs" aria-label="Staff pages">
          <a href="/admin" class="tag" aria-current="page">Staff board</a>
          <a href="/admin/templates" class="tag tag-ghost">Templates</a>
        </nav>
        <h1>Your <span class="accent">clients</span></h1>
        <p class="muted" id="admin-summary"></p>
      </div>
    </section>

    <div id="cohorts"></div>
  </main>

  <dialog class="modal verify-modal" id="verify-modal" aria-labelledby="verify-title">
    <div class="resource-shell">
      <header class="resource-head">
        <div class="resource-heading">
          <span class="resource-kind">New sign-ups</span>
          <h2 id="verify-title">Verification needed</h2>
        </div>
        <button type="button" class="modal-close" id="verify-close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <ul class="verify-list" id="verify-list"></ul>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="/admin.js?v=31"></script>
</body>
</html>
