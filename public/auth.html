<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>paidcoaching.com DFY</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=2">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=20">
</head>
<body class="auth-page">
  <main class="auth-card">
    <img src="/logo.png" alt="Paidcoaching.com" class="auth-logo">

    <h1 id="auth-title">Welcome back</h1>
    <p class="muted" id="auth-subtitle">Log in to your client hub.</p>

    <form id="auth-form" novalidate>
      <label class="field" id="name-field" hidden>
        <span>Full name</span>
        <input type="text" name="name" autocomplete="name">
      </label>
      <label class="field" id="email-field">
        <span>Email</span>
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <div class="field" id="password-field">
        <div class="field-row">
          <label for="password" id="password-label">Password</label>
          <a href="/forgot" class="forgot-link" id="forgot-link">Forgot password?</a>
        </div>
        <div class="password-wrap">
          <input type="password" id="password" name="password" autocomplete="current-password" required minlength="8">
          <button type="button" class="eye-btn" id="toggle-password" aria-label="Show password" aria-pressed="false">
            <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-2.6 3.5"/><path d="M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M2 2l20 20"/></svg>
          </button>
        </div>
      </div>

      <p class="form-error" id="form-error" role="alert"></p>
      <p class="form-success" id="form-success" role="status"></p>

      <button type="submit" class="btn btn-primary" id="submit-btn">Log in</button>
    </form>

    <p class="auth-switch">
      <span id="switch-text">Don't have an account yet?</span>
      <a href="/signup" id="switch-link">Create one</a>
    </p>
  </main>

  <script src="/auth.js?v=20"></script>
</body>
</html>
